[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke"
version = "0.3.0"
description = "Karaokê local: YouTube -> separação de voz por IA -> letra sincronizada, com Controle e Palco no navegador."
requires-python = ">=3.12"
# torch NÃO está aqui: é instalado por scripts/install.sh a partir do índice da PyTorch (cu129 | cpu).
dependencies = [
    "fastapi~=0.142",
    "uvicorn~=0.54",
    "httpx~=0.28",
    "yt-dlp[default,deno]>=2026.8.19",
    "demucs==4.1.0",
    "faster-whisper~=1.2.1",
    "soundfile~=0.14",
    "segno~=1.6.6",  # QR do modo convidado (ADR-0003 §3): puro Python, sem dependências
]

[project.optional-dependencies]
dev = ["pytest~=9.1", "ruff~=0.16"]
e2e = ["playwright~=1.63"]

[tool.setuptools.packages.find]
include = ["karaoke*"]

[tool.setuptools.package-data]
karaoke = ["web/**/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["design", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# E501: o comprimento de código é garantido pelo `ruff format`; docstrings/comentários longos são aceitos.
ignore = ["E501", "S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: precisa de GPU NVIDIA/CUDA",
    "network: precisa de internet",
    "e2e: testes de navegador (Playwright)",
]
